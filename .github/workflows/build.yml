name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key
        if: env.KS != ''
        run: printf '%s' "$KS" | base64 -d > debug.keystore

      - name: Build APK
        run: |
          docker build -t r1-android-build .
          docker run --rm -v "$PWD":/app -w /app r1-android-build ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkroom-apk
          path: darkroom.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: darkroom.apk
